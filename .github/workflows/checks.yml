name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify tooling behavior
        run: python -m unittest discover -s tests -v
      - name: Verify the zero-dependency npm installer
        run: |
          node --version
          npm --version
          node --test tests/npm/*.test.mjs
      - name: Build and validate the original teaching demo
        run: python tests/create_demo.py "$RUNNER_TEMP/mastery-demo"
      - name: Verify starter and reference controls
        run: |
          python scripts/check_milestone.py "$RUNNER_TEMP/mastery-demo" --milestone contract --variant starter
          python scripts/check_milestone.py "$RUNNER_TEMP/mastery-demo" --milestone core --variant starter
          python scripts/check_milestone.py "$RUNNER_TEMP/mastery-demo" --milestone budget --variant starter
          python scripts/check_milestone.py "$RUNNER_TEMP/mastery-demo" --milestone core --variant reference
          python scripts/check_milestone.py "$RUNNER_TEMP/mastery-demo" --milestone budget --variant reference
